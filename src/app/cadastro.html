<main class="cadastro-page">
  <section class="cadastro-card">
    <div class="cadastro-form-container">
      <div class="form-header">
        <p class="subtitle">Nova conta</p>
        <h2>Criar conta</h2>
      </div>

      <form class="cadastro-form" (submit)="onSubmit($event)">
        <label>
          <span>Nome</span>
          <input type="text" name="nome" [(ngModel)]="nome" placeholder="Seu nome" required />
        </label>

        <label>
          <span>E-mail</span>
          <input type="email" name="email" [(ngModel)]="email" placeholder="seuemail@email.com" required />
        </label>

        <label>
          <span>Senha</span>
          <input type="password" name="senha" [(ngModel)]="senha" placeholder="Crie uma senha" minlength="6" required />
        </label>

        <label>
          <span>Confirmar senha</span>
          <input type="password" name="confirmarSenha" [(ngModel)]="confirmarSenha" placeholder="Repita sua senha" minlength="6" required />
        </label>

        <label class="lgpd-row">
          <input type="checkbox" name="lgpdAccepted" [(ngModel)]="lgpdAccepted" />
          <span>Concordo com os termos da LGPD e autorizo o uso dos meus dados.</span>
        </label>

        <button type="submit" [disabled]="!lgpdAccepted">Cadastrar</button>
      </form>

      <p class="login-text">Já tem uma conta? <a routerLink="/login">Entrar</a></p>
    </div>
  </section>
</main>
